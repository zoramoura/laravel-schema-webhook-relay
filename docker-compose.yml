services:
  # ---------------------------------------------------------------------------
  # App: PHP-FPM 8.3 + Composer. Runs migrations, seeds, queue worker + Horizon.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: webhook-relay-app:latest
    container_name: webhook-relay-app
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: webhook_relay
      DB_USERNAME: relay
      DB_PASSWORD: relay_local_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
      WEBHOOK_REPLAY_WINDOW_SECONDS: 300
      WEBHOOK_IDEMPOTENCY_TTL_SECONDS: 86400
      WEBHOOK_OUTBOUND_BASE_DELAY_SECONDS: 5
      WEBHOOK_OUTBOUND_MAX_ATTEMPTS: 5
      WEBHOOK_OUTBOUND_TIMEOUT_SECONDS: 10
    volumes:
      - .:/var/www/html:delegated
    networks:
      - webhook-relay

  # ---------------------------------------------------------------------------
  # Queue worker (Laravel default queue) — processes outbound webhook jobs.
  # ---------------------------------------------------------------------------
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: webhook-relay-app:latest
    container_name: webhook-relay-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: webhook_relay
      DB_USERNAME: relay
      DB_PASSWORD: relay_local_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
    command: >
      sh -c "
        php artisan migrate --force &&
        php artisan db:seed --force &&
        php artisan queue:work --tries=3 --timeout=90 --sleep=3
      "
    volumes:
      - .:/var/www/html:delegated
    networks:
      - webhook-relay

  # ---------------------------------------------------------------------------
  # Horizon — monitors Redis queues, runs the webhook-relay queue with exponential
  # backoff. Exposes /horizon dashboard (protected behind app auth in prod).
  # ---------------------------------------------------------------------------
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: webhook-relay-app:latest
    container_name: webhook-relay-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: webhook_relay
      DB_USERNAME: relay
      DB_PASSWORD: relay_local_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
      HORIZON_PATH: /horizon
    command: php artisan horizon
    volumes:
      - .:/var/www/html:delegated
    networks:
      - webhook-relay

  # ---------------------------------------------------------------------------
  # Web: Nginx reverse proxy → PHP-FPM (app:9000).
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.26-alpine
    container_name: webhook-relay-web
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:delegated
    networks:
      - webhook-relay

  # ---------------------------------------------------------------------------
  # Database: MySQL 8.0 (set DB_CONNECTION=pgsql + swap image for Postgres).
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: webhook-relay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local_password
      MYSQL_DATABASE: webhook_relay
      MYSQL_USER: relay
      MYSQL_PASSWORD: relay_local_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "relay", "-p relay_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - webhook-relay

  # ---------------------------------------------------------------------------
  # Cache / queue backend.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: webhook-relay-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - webhook-relay

volumes:
  mysql_data:
  redis_data:

networks:
  webhook-relay:
    driver: bridge